
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1E1E1E"/>
        <stop offset="100%" stop-color="#141414"/>
      </linearGradient>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#D4AF37"/>
        <stop offset="100%" stop-color="#A68F7E"/>
      </linearGradient>
    </defs>
    <!-- Background -->
    <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
    <rect x="24" y="24" width="464" height="464" rx="76" fill="none" stroke="#A68F7E" stroke-width="6" opacity="0.4"/>
    
    <!-- Decorative Center Elements -->
    <circle cx="256" cy="120" r="10" fill="#D4AF37"/>
    
    <!-- Main Korean Typography '여백' -->
    <text x="256" y="270" text-anchor="middle" fill="#FAF8F5" font-family="serif, 'Noto Serif KR', 'Batang'" font-size="140" font-weight="700" letter-spacing="8">여백</text>
    
    <!-- Subtitle 'YEOBAEK STUDIO' -->
    <text x="256" y="360" text-anchor="middle" fill="#A68F7E" font-family="serif, 'Playfair Display', 'Cormorant Garamond'" font-size="34" font-weight="500" letter-spacing="14">STUDIO</text>
  </svg>
  